# Local enforcement layer.
#
# Fast hooks only. Mypy and pytest run in CI (.github/workflows/ci.yml),
# not here — keeping pre-commit fast prevents contributors from reaching
# for `--no-verify`.
#
# First-time setup on a fresh clone:
#     uv sync --all-groups
#     make hooks                    # equivalent to: uv run pre-commit install --install-hooks

minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
